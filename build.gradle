plugins {
	id 'java-library'
	id 'net.neoforged.moddev' version "${moddev_version}"
}

version = project.mod_version + (project.hasProperty('build_number') ? "+build.${project.build_number}" : '')
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(21)
	withSourcesJar()
}

repositories {
	exclusiveContent {
		forRepository {
			maven { url = 'https://api.modrinth.com/maven' }
		}
		filter { includeGroup 'maven.modrinth' }
	}
}

neoForge {
	version = project.neo_version

	runs {
		client {
			client()
			// The CI harness: walks the legend and the choice of race, joins a world and takes screenshots
			systemProperty 'mages_legacy.harness', project.findProperty('harness') ?: 'false'
			if (project.hasProperty('harness')) {
				programArguments.addAll('--width', '1280', '--height', '720')
			}
		}
		server {
			server()
			programArgument '--nogui'
		}
		configureEach {
			logLevel = org.slf4j.event.Level.INFO
		}
	}

	mods {
		"${mod_id}" {
			sourceSet(sourceSets.main)
		}
	}
}

dependencies {
	// Photon's API for the effects; the jars themselves go into run/mods (scripts/fetch-runtime-mods.sh)
	compileOnly "maven.modrinth:photon-editor:${photon_version}"
	compileOnly "maven.modrinth:ldlib:${ldlib2_version}"
}

tasks.withType(ProcessResources).configureEach {
	var props = [version: project.version, minecraft_version: project.minecraft_version]
	inputs.properties props
	filesMatching('META-INF/neoforge.mods.toml') {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 21
}
