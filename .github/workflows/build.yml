name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build -Pbuild_number=${{ github.run_number }} --stacktrace

      - name: GameTests
        run: |
          ./gradlew runGametest --stacktrace || true
          python3 scripts/check-junit.py build/gametest/junit.xml

      - name: Install Xvfb and software OpenGL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 > /dev/null

      - name: Client scenario and screenshot
        run: bash scripts/ci-harness.sh

      - name: Upload jar, reports, logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mages-legacy-build-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            build/libs/*.jar
            build/gametest/junit.xml
            build/gametest/logs/latest.log
            build/harness-server/logs/latest.log
            build/harness-client/logs/latest.log
            build/harness-client/harness-result.txt
            build/harness-client/screenshots/
            build/harness-client/crash-reports/

      - name: Publish dev build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/mages-legacy-*.jar | grep -v -- '-sources' | head -1)
          cp build/harness-client/screenshots/choose_mycelid.png screenshot.png
          zip -j mages-legacy-updater.zip tools/update-mages-legacy.bat tools/update-mages-legacy.ps1
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev "$JAR" screenshot.png build/harness-client/screenshots/*.png mages-legacy-updater.zip \
            --prerelease --target "$GITHUB_SHA" \
            --title "Dev build ${{ github.run_number }}" \
            --notes "Свежая сборка из main (коммит ${GITHUB_SHA::7}). Поставить: скачай mages-legacy-updater.zip, распакуй и запусти update-mages-legacy.bat. Тесты: GameTest + клиент, скриншоты приложены."

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/mages-legacy-*.jar | grep -v -- '-sources' | head -1)
          zip -j mages-legacy-updater.zip tools/update-mages-legacy.bat tools/update-mages-legacy.ps1
          gh release create "$GITHUB_REF_NAME" "$JAR" build/harness-client/screenshots/*.png mages-legacy-updater.zip --generate-notes
