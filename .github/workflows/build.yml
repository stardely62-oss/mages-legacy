name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Talent list is up to date
        run: python3 tools/talents_doc.py && git diff --exit-code docs/TALENTS.md

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build -Pbuild_number=${{ github.run_number }} --stacktrace

      - name: Photon and its libraries for the client run
        run: bash scripts/fetch-runtime-mods.sh

      - name: Install Xvfb and software OpenGL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 > /dev/null

      - name: Client scenario and screenshots
        run: bash scripts/ci-harness.sh

      - name: Contact sheets of the films
        if: always()
        run: |
          pip install --quiet pillow
          python3 scripts/contact-sheets.py run/screenshots || true

      - name: Upload jar, logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mages-legacy-build-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            build/libs/*.jar
            run/logs/latest.log
            run/harness-result.txt
            run/screenshots/
            run/crash-reports/

      # NeoForge builds go to their own prerelease: the old `dev` release (Fabric 1.20.1) still feeds the modpack
      - name: Publish NeoForge dev build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/mages-legacy-*.jar | grep -v -- '-sources' | head -1)
          zip -j mages-legacy-updater.zip tools/update-mages-legacy.bat tools/update-mages-legacy.ps1
          gh release delete neo-dev --yes --cleanup-tag || true
          gh release create neo-dev "$JAR" $(ls run/screenshots/*.png | grep -v '/film_') mages-legacy-updater.zip \
            --prerelease --target "$GITHUB_SHA" \
            --title "NeoForge 1.21.1 dev build ${{ github.run_number }}" \
            --notes "Сборка для NeoForge 1.21.1 из main (коммит ${GITHUB_SHA::7}). Поставить: скачай mages-legacy-updater.zip, распакуй и запусти update-mages-legacy.bat (сам найдёт NeoForge 1.21.1 в TLauncher и поставит Veil и GeckoLib). Играбельны Пустотники (Карман, Пустотный шаг, Повышенная гравитация); остальные расы спят."

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/mages-legacy-*.jar | grep -v -- '-sources' | head -1)
          zip -j mages-legacy-updater.zip tools/update-mages-legacy.bat tools/update-mages-legacy.ps1
          gh release create "$GITHUB_REF_NAME" "$JAR" mages-legacy-updater.zip --title "Mage's Legacy $GITHUB_REF_NAME" --generate-notes
